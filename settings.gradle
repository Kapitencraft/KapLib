import groovy.json.JsonSlurper

pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven { url = 'https://maven.parchmentmc.org' }
    }
}

file("./modules").eachFile { File it ->
    String folderName = it.name.replace(".json", "")
    include(":${folderName}")
    project(":${folderName}").projectDir = file("m_${folderName}")
}

//region bundles
file("./bundles").eachFile { File it ->
    String folderName = it.name.replace(".json", "")
    include(":bundle-${folderName}")
    project(":bundle-${folderName}").projectDir = file("bundle/${folderName}")
}

rootProject.name = "KapLib${mc_version}"