        scm {
            url = "https://github.com/Kapitencraft/kapLib/"
            connection = "scm:git:git://github.com/Kapitencraft/kapLib.git"
            developerConnection = "scm:git:ssh://git@github.com/Kapitencraft/kapLib.git"
        }
    }

}

